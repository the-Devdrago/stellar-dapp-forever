name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # soroban-sdk requires the wasm32v1-none target (Rust 1.84+).
  WASM_TARGET: wasm32v1-none

jobs:
  # Fast first gate (#238): a merge that leaves the crate unparseable or
  # uncompilable fails here within a couple of minutes, and the slower jobs
  # that `needs` it are skipped instead of each failing on the same error.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same cache as build-and-test, under its own key so this job's smaller
      # `target` dir never takes the slot build-and-test saves into.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (all targets)
        run: cargo check --locked --all-targets

  build-and-test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        if: always()
        run: cargo clippy --all-targets --locked -- -D warnings

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Test
        if: always()
        run: cargo test --locked
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Test & Coverage
        run: cargo llvm-cov --locked --all-targets --html --fail-under-lines 95

      # Uploaded even when the coverage floor fails, so the uncovered lines
      # stay visible on the failing run.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14

      - name: Build wasm (release)
        if: always()
        run: cargo build --locked --target ${{ env.WASM_TARGET }} --release

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Reject known dependency advisories
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, advisories, and sources
        run: cargo deny check advisories licenses bans sources

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.84"
          targets: wasm32v1-none

      - name: Check on MSRV
        run: cargo check --locked --all-targets

  reproducible-build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify two isolated container builds are byte-for-byte reproducible
        run: ./scripts/build-reproducible.sh