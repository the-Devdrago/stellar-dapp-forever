name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          folder-path: "."
          file-extension: ".md"
